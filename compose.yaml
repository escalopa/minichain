services:
  node:
    build:
      context: ./node
    environment:
      DIFFICULTY: "4"
      PORT: "3000"
      P2P_PORT: "4001"
    ports:
      - "3000:3000"
      - "4001:4001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/blocks"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6

  explorer:
    build:
      context: ./explorer
    environment:
      NODE_URL: http://node:3000
      PORT: "8080"
    depends_on:
      node:
        condition: service_healthy
    ports:
      - "8080:8080"

  wallet:
    build:
      context: ./wallet
    environment:
      NODE_URL: http://node:3000
    profiles: ["tools"]
